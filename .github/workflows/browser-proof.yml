name: Browser proof
on:
  pull_request:
    paths: ['tests/browser/**', 'scripts/browser-test-server.mjs', 'playwright.config.js', 'package*.json', '.github/workflows/browser-proof.yml', 'public/**', 'hosted-team.js', 'database/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deadend
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: deadend_test_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U deadend" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEADEND_TEST_DATABASE_URL: postgresql://deadend:disposable-ci-only@127.0.0.1:5432/deadend_test_browser
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-proof
          path: docs/evidence/
          retention-days: 7
  hosted-browser:
    # Only the dedicated proof PR may create disposable production test accounts.
    # Stacked feature PRs use isolated local PostgreSQL and never duplicate this job.
    if: github.event_name == 'pull_request' && github.head_ref == 'task/01-browser-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEADEND_BROWSER_BASE_URL: https://deadend-ai-codersinpune.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser -- tests/browser/journeys.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-browser-proof
          path: docs/evidence/
          retention-days: 7
